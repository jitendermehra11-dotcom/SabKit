name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build Android Project
        run: |
          # प्रोजेक्ट फाइल (settings.gradle या build.gradle) को ऑटोमैटिक ढूंढना
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          echo "Found project directory: $PROJECT_DIR"
          
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Project root files:"
            ls -la
            exit 1
          fi

          cd "$PROJECT_DIR"
          echo "Current directory: $(pwd)"
          
          # अगर gradlew न हो तो रैपर जनरेट करना
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SabKit-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
